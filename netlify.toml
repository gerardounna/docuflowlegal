[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/demo-request"
  to = "/.netlify/functions/demo-request"
  status = 200

[[redirects]]
  from = "/api/generate-document"
  to = "/.netlify/functions/generate-document"
  status = 200
